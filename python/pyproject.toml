[project]
name = "budget-analyser-aggregation"
version = "0.1.0"
description = "Agrégation des sources publiques — brique V0"
requires-python = ">=3.13"
dependencies = ["frictionless>=5.17"]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
    "mutmut>=3",
    "pytest-cov>=7.1.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.mypy]
strict = true

[tool.ruff]
target-version = "py313"
extend-exclude = ["mutants"]

[tool.coverage.run]
branch = true
source = ["src"]

[tool.coverage.report]
show_missing = true
exclude_also = ['if __name__ == "__main__":']

[tool.mutmut]
source_paths = ["src/contract", "src/ingest", "src/sources"]
pytest_add_cli_args_test_selection = ["tests"]
