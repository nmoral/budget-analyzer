[project]
name = "budget-analyser-aggregation"
version = "0.1.0"
description = "Agrégation des sources publiques — brique V0"
requires-python = ">=3.13"
dependencies = ["frictionless>=5.17"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11", "mutmut>=3"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.mypy]
strict = true

[tool.ruff]
target-version = "py313"
extend-exclude = ["mutants"]
