parameters:
    # Racine du dépôt de données, montée en lecture seule sous /data dans le conteneur.
    # Surchargée par BUDGET_DATA_DIR (ou l'option --data-dir, ex. pour une racine fixture).
    env(BUDGET_DATA_DIR): '/data'

services:
    _defaults:
        autowire: true
        autoconfigure: true
        bind:
            string $defaultDataDir: '%env(BUDGET_DATA_DIR)%'

    App\:
        resource: '../src/'
        exclude:
            - '../src/Kernel.php'
            # Objets de données de domaine (value objects / DTO) : non autowirables
            # (arguments scalaires ou interfaces sans service), construits à la main
            # par le moteur et l'adapter, jamais injectés comme services.
            - '../src/Domain/Profile/Profile.php'
            - '../src/Domain/Rule/ResolvedRules.php'

    # Port de domaine « taux daté » (#13) résolu vers l'adapter d'infrastructure
    # au-dessus des paramètres datés (#04) : toute injection de `DatedRateProvider`
    # reçoit l'adapter, sans que le domaine connaisse l'infrastructure.
    App\Domain\Shared\DatedRateProvider: '@App\Infrastructure\Rate\DatedRateProviderAdapter'

    # Résolveurs de règles enfichables (#12) : chacun reçoit un service locator des
    # implémentations de sa famille, indexé par le code métier (attribut `code` du
    # tag). La sélection passe donc par le locator, jamais par un `match`/`if` sur un
    # code. Publics : ce sont les points d'entrée du moteur, consommés par les tests
    # en #12 et par le calcul en #13→#18 (sans quoi ils seraient supprimés, inutilisés).
    App\Domain\Rule\Retirement\RetirementRuleResolver:
        public: true
        arguments:
            $rules: !tagged_locator { tag: 'app.rule.retirement', index_by: 'code' }

    App\Domain\Rule\Indemnitary\IndemnitaryRuleResolver:
        public: true
        arguments:
            $rules: !tagged_locator { tag: 'app.rule.indemnitary', index_by: 'code' }

    App\Domain\Rule\Funder\FunderRuleResolver:
        public: true
        arguments:
            $rules: !tagged_locator { tag: 'app.rule.funder', index_by: 'code' }

    App\Domain\Rule\CostView\CostViewRuleResolver:
        public: true
        arguments:
            $rules: !tagged_locator { tag: 'app.rule.cost_view', index_by: 'code' }

when@test:
    services:
        # Implémentations de TEST prouvant la découvrabilité par tag (aucune règle
        # métier réelle n'est livrée en #12 — ossature pure). Chaque fixture est taggée
        # dans sa famille avec son code comme clé d'index du locator : l'ajout d'une
        # telle implémentation la rend résolvable sans toucher au moteur ni aux
        # résolveurs (C3).
        App\Tests\Fixtures\Rule\Retirement\CasCivilRetirementRule:
            tags: [{ name: 'app.rule.retirement', code: 'CAS_CIVIL' }]
        App\Tests\Fixtures\Rule\Retirement\EnfichableRetirementRule:
            tags: [{ name: 'app.rule.retirement', code: 'X_TEST' }]
        App\Tests\Fixtures\Rule\Indemnitary\IfseIndemnitaryRule:
            tags: [{ name: 'app.rule.indemnitary', code: 'IFSE' }]
        App\Tests\Fixtures\Rule\Funder\EtatFunderRule:
            tags: [{ name: 'app.rule.funder', code: 'ETAT_P140' }]
        App\Tests\Fixtures\Rule\CostView\AnnualCostViewRule:
            tags: [{ name: 'app.rule.cost_view', code: 'ANNEE_1' }]

        # Repositories rendus publics en test pour pouvoir les récupérer depuis le
        # conteneur de test (sinon supprimés car inlined, faute de référence applicative
        # tant que le moteur de calcul — #12 — ne les injecte pas).
        App\Infrastructure\Repository\DatedParameterRepository:
            autowire: true
            public: true
        App\Infrastructure\Repository\GrilleRepository:
            autowire: true
            public: true
        App\Infrastructure\Repository\PrimeRateRepository:
            autowire: true
            public: true
