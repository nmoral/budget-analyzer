doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'
    orm:
        auto_generate_proxy_classes: true
        enable_native_lazy_objects: true
        report_fields_where_declared: true
        validate_xml_mapping: true
        naming_strategy: doctrine.orm.naming_strategy.underscore_number_aware
        auto_mapping: true
        mappings:
            App:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Infrastructure/Entity'
                prefix: 'App\Infrastructure\Entity'
                alias: App

when@test:
    doctrine:
        dbal:
            # Base de test dédiée `budget_test` (suffixe `_test`, mécanisme Doctrine
            # natif) : les tests ne touchent jamais aux données de dev de `budget`.
            # Provisionnée et remise à zéro par `tests/bootstrap.php`.
            dbname_suffix: '_test'
