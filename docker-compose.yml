services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  symfony:
    build:
      context: ./symfony
      # UID/GID de l'hôte, pour que les fichiers créés par le conteneur (var/, vendor/)
      # n'appartiennent pas à root. Le Makefile les exporte via `id -u`/`id -g` ;
      # en appel direct, défaut 1000 (cas courant).
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?serverVersion=16&charset=utf8"
      APP_ENV: dev
      APP_DEBUG: "1"
      APP_SECRET: "${APP_SECRET:-dev-secret}"
    ports:
      - "${WEB_PORT}:8000"
    volumes:
      - ./symfony:/app
      - ./data:/data:ro
      # Volume anonyme : préserve le vendor/ construit dans l'image malgré le bind-mount ./symfony.
      - /app/vendor
    # Serveur web = PHP intégré ; public/index.php sert aussi de routeur (routes Symfony).
    command: ["php", "-S", "0.0.0.0:8000", "-t", "public", "public/index.php"]

  python:
    build: ./python
    volumes:
      - ./python:/app
      - ./data:/data
    # Scripts d'ingestion câblés en V0 (#01+) ; conteneur maintenu vivant d'ici là.
    command: ["sleep", "infinity"]

volumes:
  db-data:
