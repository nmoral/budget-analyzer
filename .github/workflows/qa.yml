name: qa

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Chaîne Python (= make qa-python) : ruff, format, mypy, cov 90/100, checks,
  # mutmut+MSI, frictionless. Tourne en parallèle de qa-symfony (aucun needs mutuel).
  qa-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          # Cache uv persistant entre runs ; invalidé quand uv.lock change (C1).
          enable-cache: true
          cache-dependency-glob: python/uv.lock

      - name: Sync Python dependencies
        run: cd python && uv sync

      - name: make qa-python
        run: make qa-python

  # Chaîne PHP (= make qa-symfony) : php-cs-fixer, phpstan, phpunit, avec pré-build
  # buildx/cache gha de l'image symfony. Tourne en parallèle de qa-python.
  qa-symfony:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # docker compose lit ces variables (ports, Postgres, nom de projet).
      # Le .env est gitignoré (propre au worktree) : la CI le dérive de .env.example.
      - name: Prepare environment file
        run: cp .env.example .env

      # Hôte UID/GID : le Makefile build l'image symfony avec ces args (id -u / id -g).
      # On les passe au pré-build buildx pour que la clé de cache de layers coïncide
      # avec celle de `docker compose build symfony` (sinon les layers post-ARG rejouées).
      - name: Compute host UID/GID
        id: ids
        run: |
          echo "uid=$(id -u)" >> "$GITHUB_OUTPUT"
          echo "gid=$(id -g)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Pré-build de l'image symfony avec cache de layers persistant (type=gha) : réchauffe
      # le cache du builder buildx (par défaut dans ce job) à partir de GitHub Actions Cache.
      # `docker compose build symfony` (dans `make qa-symfony`) réutilise ensuite ce même
      # builder : layers apt/composer CACHED si composer.lock inchangé, rejouées sinon (C2).
      # Pas de load/push : seul le cache importe, le make rebuild depuis ce cache chaud.
      - name: Warm Docker layer cache (symfony)
        uses: docker/build-push-action@v6
        with:
          context: ./symfony
          file: ./symfony/Dockerfile
          push: false
          build-args: |
            UID=${{ steps.ids.outputs.uid }}
            GID=${{ steps.ids.outputs.gid }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: make qa-symfony
        run: make qa-symfony

  # Gate agrégateur : SEUL check requis par la protection de main (nom `qa` préservé).
  # Ne fait que dépendre des deux chaînes ; rouge si l'une d'elles échoue (C3.2).
  qa:
    needs: [qa-python, qa-symfony]
    runs-on: ubuntu-latest
    steps:
      - name: Gate
        run: echo "qa-python et qa-symfony verts, gate qa OK"
