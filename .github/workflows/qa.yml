name: qa

on:
  push:
    branches: [main]
  pull_request:

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # docker compose lit ces variables (ports, Postgres, nom de projet).
      # Le .env est gitignoré (propre au worktree) : la CI le dérive de .env.example.
      - name: Prepare environment file
        run: cp .env.example .env

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Sync Python dependencies
        run: cd python && uv sync

      # Source unique de la chaîne qualité : le Makefile (make qa = qa-python + qa-symfony).
      # Échec bloquant au moindre garde-fou KO.
      - name: make qa
        run: make qa
